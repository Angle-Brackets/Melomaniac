[workspace]
members = [".", "crates/audio", "crates/storage", "crates/sync", "crates/oauth"]
resolver = "2"

[package]
name = "melomaniac"
version = "1.1.0-alpha"
description = "An app for infinite music"
authors = ["Soupa"]
edition = "2024"

[lib]
name = "melomaniac_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
melomaniac-audio   = { path = "crates/audio" }
melomaniac-storage = { path = "crates/storage" }
melomaniac-sync    = { path = "crates/sync" }
melomaniac-oauth   = { path = "crates/oauth" }
tauri = { version = "2.11.0", features = [] }
tauri-plugin-shell           = "2.3.5"
tauri-plugin-dialog          = "2"
tauri-plugin-barcode-scanner = "2"
base64   = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio   = { version = "1",   features = ["sync", "fs", "macros", "rt", "net", "io-util", "time"] }
uuid    = { version = "1",   features = ["v4"] }
discord-rich-presence = "1"
rand    = "0.8"
sha2    = "0.10"
url     = "2"
strsim  = "0.11"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rodio = { version = "0.22", features = ["symphonia-all"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# keyring has no default storage backend -- without one of these features it
# silently falls back to a no-op mock store (writes "succeed" but nothing is
# ever actually persisted, so the very next read returns NoEntry).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

